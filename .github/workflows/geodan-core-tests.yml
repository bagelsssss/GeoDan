name: GeoDan core tests

on:
  push:
    branches:
      - main
      - workflow-codex/trajectory-rebuild
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up C++ compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Build and run hitbox and trail tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Icore tests/test_hitbox_model.cpp -o /tmp/test-hitbox
          /tmp/test-hitbox
      - name: Build and run tool registry tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Icore tests/test_tool_registry.cpp -o /tmp/test-registry
          /tmp/test-registry
      - name: Build and run trajectory model tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Icore tests/test_trajectory_model.cpp -o /tmp/test-trajectory
          /tmp/test-trajectory
