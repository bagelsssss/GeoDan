name: GeoDan Codex self-review tests
on:
  workflow_dispatch:
  push:
    branches: [workflow-codex/trajectory-rebuild]
    paths: [.github/workflows/geodan-core-tests.yml]

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test_hitbox_model (compile and run)
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -I./core -I. tests/test_hitbox_model.cpp -o /tmp/geodan-hitbox_model-review && /tmp/geodan-hitbox_model-review
      - name: test_tool_registry (compile and run)
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -I./core -I. tests/test_tool_registry.cpp -o /tmp/geodan-tool_registry-review && /tmp/geodan-tool_registry-review
      - name: test_trajectory_model (compile and run)
        run: >-
          g++ -std=c++20 -Wall -Wextra -Werror -I./core -I. tests/test_trajectory_model.cpp -o /tmp/geodan-trajectory_model-review && /tmp/geodan-trajectory_model-review
