name: GeoDan Image Parser portable tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Image Parser tests
        run: g++ -std=c++20 -Wall -Wextra -Werror -Icore tests/test_image_parser.cpp -o /tmp/geodan-image-parser-tests
      - name: Run Image Parser tests
        run: /tmp/geodan-image-parser-tests
