name: GeoDan analyzer portable tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyzer-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Dan Analyzer evidence model tests
        run: g++ -std=c++20 -Wall -Wextra -Werror -Icore tests/test_dan_analyzer_model.cpp -o /tmp/geodan-dan-analyzer-tests
      - name: Run Dan Analyzer evidence model tests
        run: /tmp/geodan-dan-analyzer-tests
